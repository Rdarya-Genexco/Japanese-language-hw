[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Google sign-in needs apis.google.com scripts and the *.firebaseapp.com auth iframe.
    # Wildcards keep the project ID out of this file (Netlify's secret scanner flags it).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://apis.google.com https://accounts.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://fonts.gstatic.com https://apis.google.com https://accounts.google.com; img-src 'self' data: blob: https:; frame-src 'self' blob: https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:;"

# Never cache HTML so browsers always pick up new asset hashes
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache JS/CSS aggressively — hashed filenames make this safe
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
