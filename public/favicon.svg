<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#4F46E5"/>
  <!-- Road deck -->
  <rect x="6" y="60" width="88" height="8" rx="2" fill="white"/>
  <!-- Left tower -->
  <rect x="18" y="26" width="10" height="40" rx="2" fill="white"/>
  <!-- Right tower -->
  <rect x="72" y="26" width="10" height="40" rx="2" fill="white"/>
  <!-- Left tower cap -->
  <rect x="13" y="22" width="20" height="7" rx="2" fill="white"/>
  <!-- Right tower cap -->
  <rect x="67" y="22" width="20" height="7" rx="2" fill="white"/>
  <!-- Cables: left tower to far left -->
  <line x1="23" y1="26" x2="6"  y2="60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cables: left tower to center -->
  <line x1="23" y1="26" x2="50" y2="59" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cables: right tower to far right -->
  <line x1="77" y1="26" x2="94" y2="60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cables: right tower to center -->
  <line x1="77" y1="26" x2="50" y2="59" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Suspenders -->
  <line x1="36" y1="43" x2="36" y2="59" stroke="white" stroke-width="1.5"/>
  <line x1="64" y1="43" x2="64" y2="59" stroke="white" stroke-width="1.5"/>
</svg>
